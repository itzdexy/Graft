name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Brand check
        run: npm run check:brand

      - name: Source layout check
        run: npm run check:layout

      - name: Dead UI check
        run: npm run check:dead-ui

      # `npm test` is now plain `bun test`, so it already covers everything the
      # old "additional suites" step listed by hand.
      - name: Run Tovyr unit tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke CLI version
        run: bun run src/entrypoints/cli.tsx --version
        env:
          TOVYR_FORCE_INTERACTIVE: '0'

      - name: Smoke node launcher
        run: node bin/tovyr.js --version

      - name: npm pack dry-run
        run: node scripts/publish-npm.js --dry-run

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Tovyr unit tests
        run: npm run test

      - name: Doctor
        run: node scripts/tovyr-doctor.js

      - name: Smoke node launcher
        run: node bin/tovyr.js --version

      - name: Smoke PowerShell launcher version
        run: powershell -NoProfile -ExecutionPolicy Bypass -File bin/tovyr.ps1 --version
