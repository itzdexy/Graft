name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Blink unit tests
        run: bun test services/blink components/blink/BlinkLiveActivity.test.tsx utils/filePersistence/types.test.ts utils/earlyInput.test.ts ink/events/input-event.test.ts constants/blinkSystemPrompt.test.ts

      - name: Smoke CLI version
        run: bun run entrypoints/cli.tsx --version
        env:
          BLINK_FORCE_INTERACTIVE: '0'

      - name: Smoke node launcher
        run: node bin/blink.js --version

      - name: npm pack dry-run
        run: node scripts/publish-npm.js --dry-run

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Blink unit tests
        run: bun test services/blink utils/earlyInput.test.ts ink/events/input-event.test.ts

      - name: Doctor
        run: node scripts/blink-doctor.js

      - name: Smoke node launcher
        run: node bin/blink.js --version

      - name: Smoke PowerShell launcher version
        run: powershell -NoProfile -ExecutionPolicy Bypass -File bin/blink.ps1 --version